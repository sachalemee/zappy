name: zappy

on:
  push:
    branches-ignore:
      - "ga-ignore-*"

  pull_request:
    types: [opened]
    branches-ignore:
      - "ga-ignore-*"

env:
  EXECUTABLES: zappy_server zappy_gui zappy_ai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check_program_compilation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            clang \
            cmake \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Install raylib from source
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DBUILD_SHARED_LIBS=ON -DUSE_WAYLAND=OFF
          sudo cmake --build /tmp/raylib/build --target install
          sudo ldconfig

      - name: Configure project
        run: cmake -S . -B build

      - name: Build project
        run: cmake --build build -j
        timeout-minutes: 2

      - name: Build zappy server
        run: cmake --build build --target zappy_server

      - name: Build zappy gui
        run: cmake --build build --target zappy_gui

      - name: Build zappy ai
        run: cmake --build build --target zappy_ai

      - name: Clean project
        run: cmake --build build --target clean
        timeout-minutes: 2

      - name: Rebuild project
        run: |
          rm -rf build zappy_server zappy_gui zappy_ai
          cmake -S . -B build
          cmake --build build -j
        timeout-minutes: 2

      - name: Check executables
        run: |
          for exec in $EXECUTABLES; do
            if [ ! -f "$exec" ]; then
              echo "::error title=Missing executable::$exec not found"
              exit 1
            fi
            if [ ! -x "$exec" ]; then
              echo "::error title=Not executable::$exec is not executable"
              exit 1
            fi
          done

      - name: Complete project clean
        run: rm -rf build zappy_server zappy_gui zappy_ai
